<html lang="en">

        :root {
            --primary: #1d3557;
            --secondary: #457b9d;
            --accent: #1d3557;
            --bg-dark: #f1faee;
            --text: #1d3557;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(29, 53, 87, 0.15);
            --card-bg: rgba(29, 53, 87, 0.03);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f7ece1, #f4f1de, #e9e5d9);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(247, 245, 240, 0.2);
            z-index: -1;
        }

        .heads {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin: 40px 20px 20px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(29, 53, 87, 0.12);
        }

        #container {
            width: 92%;
            max-width: 850px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 24px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(29, 53, 87, 0.06);
            text-align: center;
        }

        .search-section h1 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            font-weight: 600;
            color: var(--text);
            opacity: 0.9;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        select,
        input[type="text"] {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(29, 53, 87, 0.15);
            background: rgba(255, 255, 255, 0.7);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        select:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(29, 53, 87, 0.1);
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(29, 53, 87, 0.2);
            transform: translateY(-3px);
        }

        .btn-secondary {
            border-color: #8d99ae;
            color: #8d99ae;
        }

        .btn-secondary:hover {
            background: #8d99ae;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(141, 153, 174, 0.2);
        }

        /* Result Card Styles */
        #busDetails {
            display: none;
            margin-top: 40px;
            text-align: left;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 25px;
            border: 1px solid rgba(29, 53, 87, 0.08);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .result-header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.85rem;
            color: rgba(29, 53, 87, 0.6);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timings-box {
            grid-column: 1 / -1;
            background: rgba(29, 53, 87, 0.04);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid rgba(29, 53, 87, 0.06);
        }

        #message {
            color: #e63946;
            margin-top: 20px;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            background: rgba(230, 57, 70, 0.08);
            border: 1px solid rgba(230, 57, 70, 0.15);
            display: none;
        }

        .footer-tools {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .translator-container {
            background: var(--glass-bg);
            padding: 12px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        /* Responsive UI */
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            .heads {
                margin-top: 20px;
            }
        }

        select option {
            background: #eedec9;
            color: var(--text);
        }
    </style>

</head>

        function searchBusDetails() {
            const input = document.getElementById("busStandInput").value.trim();
            const messageElement = document.getElementById("message");
            const detailsDiv = document.getElementById("busDetails");

            if (!input) {
                showMsg("Please enter a destination or select one from the list.");
                return;
            }

            let matchedKey = Object.keys(busStands).find(key =>
                key.toLowerCase() === input.toLowerCase()
            );

            if (!matchedKey) {
                // Try partial match (starts with)
                matchedKey = Object.keys(busStands).find(key =>
                    key.toLowerCase().startsWith(input.toLowerCase())
                );
            }

            if (!matchedKey) {
                // Try partial match (includes)
                matchedKey = Object.keys(busStands).find(key =>
                    key.toLowerCase().includes(input.toLowerCase())
                );
            }

            if (matchedKey) {
                const details = busStands[matchedKey];

                // Duration Logic: heuristic to check if duration represents hours or minutes
                let durationStr = "";
                if ((details.distance / details.travelDuration) >= 5) {
                    durationStr = details.travelDuration + " hours";
                } else {
                    durationStr = details.travelDuration + " minutes";
                }

                // Update Card
                document.getElementById("valDest").innerHTML = `🚌 ${matchedKey}`;
                document.getElementById("valPlace").innerHTML = `🏢 ${details.place}`;
                document.getElementById("valPlatform").innerHTML = `📍 ${details.platform}`;
                document.getElementById("valDist").innerHTML = `📏 ${details.distance} km`;
                document.getElementById("valDuration").innerHTML = `⏳ ${durationStr}`;
                document.getElementById("valTimings").innerHTML = `🕒 ${details.timings.join(", ")}`;

                detailsDiv.style.display = "block";
                messageElement.style.display = "none";

                // Smooth scroll to results
                setTimeout(() => {
                    detailsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            } else {
                showMsg("❌ Destination not found. Try one from the dropdown list.");
                detailsDiv.style.display = "none";
            }
        }

        function showMsg(txt) {
            const el = document.getElementById("message");
            el.innerText = txt;
            el.style.display = "block";
        }

        function clearSearch() {
            document.getElementById("busStandInput").value = "";
            document.getElementById("busDropdown").value = "";
            document.getElementById("busDetails").style.display = "none";
            document.getElementById("message").style.display = "none";
            stopSpeaking();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') searchBusDetails();
        }

        function copyBusNameToInput() {
            const val = document.getElementById("busDropdown").value;
            if (val) {
                document.getElementById("busStandInput").value = val;
                searchBusDetails(); // Auto search on dropdown select
            }
        }

        function speakBusDetails() {
            const dest = document.getElementById("valDest").innerText.replace('🚌 ', '');
            const timings = document.getElementById("valTimings").innerText.replace('🕒 ', '');
            const platform = document.getElementById("valPlatform").innerText.replace('📍 ', '');

            if (dest === "---") return;

            const lang = document.querySelector('.goog-te-combo')?.value || 'en';
            let text = "";
            if (lang === 'kn') {
                text = `${dest} ಬಸ್ ವಿವರಗಳು. ಪ್ಲಾಟ್‌ಫಾರ್ಮ್ ಸಂಖ್ಯೆ ${platform}. ಸಮಯಗಳು: ${timings}.`;
            } else if (lang === 'hi') {
                text = `${dest} के लिए बस विवरण। प्लेटफॉर्म नंबर ${platform}। बस का समय है: ${timings}.`;
            } else {
                text = `Bus details for ${dest}. Platform number ${platform}. Timings are: ${timings}.`;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'kn' ? 'kn-IN' : (lang === 'hi' ? 'hi-IN' : 'en-US');
            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() { window.speechSynthesis.cancel(); }

        function translateToHindi() { updateTranslate('hi'); }
        function translateToKannada() { updateTranslate('kn'); }

        function updateTranslate(lang) {
            const el = document.querySelector('.goog-te-combo');
            if (el) {
                el.value = lang;
                el.dispatchEvent(new Event('change'));
            }
        }
